<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="https://augustineiacopelli.github.io/appaday/icons/151.png">
<meta name="apple-mobile-web-app-title" content="Readers 2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#14142e">
<meta name="description" content="Rainbow Readers 2.0: an offline phonics and sight word practice app for grades 1 through 3, playable with touch, keyboard, or a game controller.">
<title>Rainbow Readers 2.0 | AppADay 151</title>
<style>
:root{
  --bg:#14142e; --bg2:#1d1d44; --panel:#262659; --panel2:#30306c; --ink:#fbf8ee; --dim:#c9c6e8;
  --r1:#ff5a5f; --r2:#ff9f40; --r3:#ffd93d; --r4:#5ad86a; --r5:#4cc3ff; --r6:#6c7bff; --r7:#c06bff;
  --good:#5ad86a; --warn:#ff9f40;
  --rainbow:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6),var(--r7));
  --rad:clamp(14px,2vw,26px);
  --btn:44px;
  --fs-s:clamp(.9rem,1.2vw + .9vh,1.35rem);
  --fs-m:clamp(1.05rem,1.6vw + 1.2vh,2rem);
  --fs-l:clamp(1.5rem,2.6vw + 2vh,3.4rem);
  --fs-xl:clamp(2.2rem,4.5vw + 3vh,6rem);
  --gap:clamp(8px,1.4vw,22px);
}
@media (min-aspect-ratio:16/10){ :root{ --btn:max(44px,9vh); } }
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; display:grid; grid-template-rows:auto 1fr auto;
  padding:max(5vh,env(safe-area-inset-top)) max(5vw,env(safe-area-inset-right)) max(5vh,env(safe-area-inset-bottom)) max(5vw,env(safe-area-inset-left));
  gap:var(--gap);
  font-family:"Trebuchet MS","Segoe UI Rounded","Arial Rounded MT Bold","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:var(--fs-m); line-height:1.35;
  background:radial-gradient(120vmax 80vmax at 50% -20%,#2c2c6e 0%,var(--bg) 60%);
  overflow-x:hidden;
}
a{color:var(--r3)}
.hdr,.ftr{display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap}
.hdr{justify-content:space-between}
.hdr .brand{display:flex;flex-direction:column;align-items:center;text-align:center;flex:1 1 auto;min-width:0}
.hdr .num{font-size:var(--fs-s);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.hdr .name{font-size:var(--fs-l);font-weight:800;line-height:1.05;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr .right{display:flex;align-items:center;gap:var(--gap)}
.back-link{font-size:var(--fs-s);text-decoration:none;color:var(--dim);padding:10px 0;min-height:44px;display:inline-flex;align-items:center}
.back-link:hover,.back-link:focus{color:var(--r3)}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:800;font-size:var(--fs-m);min-height:44px}
.stars svg{width:1.3em;height:1.3em}
.vm{font-size:var(--fs-s);background:var(--warn);color:#1a1300;border-radius:999px;padding:4px 10px;font-weight:700;display:none}
.vm.on{display:inline-block}
.ftr{justify-content:space-between;font-size:var(--fs-s);color:var(--dim)}
.stage{position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column}
.screen{display:none;flex:1 1 auto;flex-direction:column;align-items:center;justify-content:center;gap:var(--gap);padding:6px 4px 12px}
.screen.on{display:flex}
.panel{background:var(--bg2);border-radius:var(--rad);padding:var(--gap);width:min(100%,1100px)}
h2{margin:0;font-size:var(--fs-l);text-align:center}
p{margin:0}
.dim{color:var(--dim)}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;align-items:center}

/* buttons */
.btn{
  font:inherit; font-weight:800; color:var(--ink); background:var(--panel2); border:0; border-radius:var(--rad);
  min-height:var(--btn); min-width:var(--btn); padding:.35em .9em; cursor:pointer; position:relative;
  display:inline-flex; align-items:center; justify-content:center; gap:.4em; touch-action:manipulation;
  transition:transform .12s ease, background .2s ease; -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:#3b3b82}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.big{font-size:var(--fs-l);min-height:calc(var(--btn) * 1.5);padding:.3em 1.4em;background:linear-gradient(135deg,#ff6b6b,#ffb347 35%,#ffe066 60%,#6bdc7a);color:#1b1640}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 3px var(--panel2)}
.btn.warn{background:#b8323a}
.btn.ok{background:#2e8b48}
.btn svg{width:1.2em;height:1.2em;flex:none}
.btn:focus{outline:none}
.btn:focus,.fx:focus{transform:scale(1.06);z-index:2}
.btn:focus::after,.fx:focus::after{
  content:""; position:absolute; inset:-7px; border-radius:calc(var(--rad) + 7px); padding:6px; pointer-events:none;
  background:var(--rainbow);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); mask-composite:exclude;
}
textarea{font:inherit;font-size:var(--fs-m);width:100%;min-height:9em;background:#0f0f26;color:var(--ink);border:3px solid var(--panel2);border-radius:12px;padding:10px}
textarea:focus{outline:none;border-color:var(--r3)}

/* gear hold */
.gear{isolation:isolate;background:var(--panel);border-radius:50%;padding:0;width:var(--btn);height:var(--btn)}
.gear::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--r3) calc(var(--hold,0) * 1turn),transparent 0);z-index:-1}

/* title */
.logo{font-size:var(--fs-xl);font-weight:900;text-align:center;line-height:1;background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{width:clamp(120px,22vmin,260px);height:auto}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* prompt + words */
.prompt{display:flex;align-items:center;justify-content:center;gap:var(--gap);flex-wrap:wrap}
.prompt .say{font-size:var(--fs-xl);font-weight:900;letter-spacing:.03em}
.prompt .hint{font-size:var(--fs-m);color:var(--dim)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:clamp(10px,1.4vw,18px);height:clamp(10px,1.4vw,18px);border-radius:50%;background:var(--panel2);display:block}
.dots i.done{background:var(--good)}
.dots i.now{background:var(--r3)}
.word{font-size:var(--fs-l);font-weight:900;letter-spacing:.02em;text-transform:none}

/* bubbles */
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(10px,2.4vw,34px);width:100%;flex:1 1 auto;padding:10px}
.bubble{border-radius:50%;width:clamp(96px,17vmin,210px);height:clamp(96px,17vmin,210px);font-size:var(--fs-l);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 9%,transparent 10%),radial-gradient(circle at 50% 50%,var(--c,#4cc3ff) 0 60%,#ffffff22 100%);
  color:#11112a;animation:float 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.bubble:hover{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.8) 0 9%,transparent 10%),radial-gradient(circle at 50% 50%,var(--c,#4cc3ff) 0 60%,#ffffff44 100%)}
.bubble:focus::after{border-radius:50%}
.bubble.pop{animation:pop .35s ease forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pop{to{transform:scale(1.35);opacity:0}}
.shake{animation:shake .5s ease 2 !important}
@keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:9px}60%{translate:-6px}80%{translate:6px}}

/* build */
.slots{display:flex;gap:clamp(6px,1vw,14px);justify-content:center;flex-wrap:wrap}
.slot{width:clamp(48px,8vmin,110px);height:clamp(60px,10vmin,130px);border-radius:14px;border:4px dashed var(--panel2);display:flex;align-items:center;justify-content:center;font-size:var(--fs-l);font-weight:900}
.slot.fill{border-style:solid;border-color:var(--good);background:#1f4a2c}
.tiles{display:flex;gap:var(--gap);justify-content:center;flex-wrap:wrap;width:100%}
.tile{font-size:var(--fs-l);min-width:clamp(56px,9vmin,120px);background:#f4efe1;color:#1b1640}
.tile.used{visibility:hidden}
.model{font-size:var(--fs-l);font-weight:900;color:var(--r3);letter-spacing:.15em}

/* bingo */
.card{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);width:min(100%,78vmin,720px)}
.cell{aspect-ratio:1.4;font-size:var(--fs-m);background:#f4efe1;color:#1b1640;width:100%}
.cell.mark{background:var(--good);color:#082010}
.cell.mark::before{content:"";position:absolute;inset:12%;border-radius:50%;border:5px solid rgba(255,255,255,.75)}
.cell.win{background:var(--r3)}

/* sentence */
.sline{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:calc(var(--btn) + 8px);width:100%;padding:8px;border-radius:14px;background:#0f0f26}
.sline span{font-size:var(--fs-l);font-weight:800;padding:2px 10px;border-radius:10px;background:#1f4a2c}

/* sort */
.sortcard{font-size:var(--fs-xl);font-weight:900;background:#f4efe1;color:#1b1640;border-radius:var(--rad);padding:.15em .8em;min-width:3em;text-align:center}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:var(--gap);width:min(100%,1000px)}
.bin{flex-direction:column;min-height:calc(var(--btn) * 2);font-size:var(--fs-l);background:var(--panel);border:4px solid var(--bc,var(--r5))}
.bin small{font-size:var(--fs-s);color:var(--dim);font-weight:700}

/* passage */
.passage{font-size:clamp(1.1rem,1.3vw + 1.5vh,2.5rem);line-height:1.55;max-width:1000px;text-align:left}
.passage .w{border-radius:8px;padding:0 3px;cursor:pointer}
.passage .w.hl{background:var(--r3);color:#1b1640}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--gap);width:min(100%,1000px)}
.choices .btn{font-size:var(--fs-m);text-align:center}

/* home */
.home-top{display:flex;flex-direction:column;align-items:center;gap:6px}
.step-band{font-size:var(--fs-s);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.step-title{font-size:var(--fs-l);font-weight:900;text-align:center}
.arc{width:min(78vw,520px,46vh * 2);height:auto}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:var(--gap);width:min(100%,1000px)}
.games .btn{flex-direction:column;font-size:var(--fs-s);min-height:calc(var(--btn) * 1.3)}
.games .btn svg{width:2em;height:2em}

/* reward */
.tally{font-size:var(--fs-xl);font-weight:900;display:flex;align-items:center;gap:.2em}
.tally svg{width:1em;height:1em}
.unlock{display:flex;flex-direction:column;align-items:center;gap:6px;animation:popin .6s ease}
@keyframes popin{from{transform:scale(.3);opacity:0}}

/* shelf */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(90px,14vmin,170px),1fr));gap:var(--gap);width:min(100%,1100px)}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);border-radius:var(--rad);padding:8px;font-size:var(--fs-s);text-align:center}
.chip svg{width:100%;height:auto;max-width:150px}

/* parent */
.parent{display:grid;gap:var(--gap);width:min(100%,1100px)}
.parent h3{margin:0 0 6px;font-size:var(--fs-m);color:var(--r3)}
.parent .btn{font-size:var(--fs-s)}
.parent .btn.sel{background:var(--r6)}
.kv{font-size:var(--fs-m);font-weight:800;min-width:3.5em;text-align:center}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(8,8,24,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:5vh 5vw}
.overlay.on{display:flex}
.flystar{position:fixed;z-index:60;width:clamp(28px,4vmin,56px);height:clamp(28px,4vmin,56px);pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1),opacity .7s ease}
.toast{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);background:var(--panel2);padding:10px 18px;border-radius:999px;font-size:var(--fs-s);z-index:70;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
@media (max-width:520px){
  .hdr .name{font-size:clamp(1.2rem,6vw,1.8rem)}
  .bins{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .bubble,.bob{animation:none} }
</style>
</head>
<body>
<header class="hdr">
  <a class="back-link fx" href="https://augustineiacopelli.github.io/appaday/" id="hdrBack">&larr; AppADay</a>
  <div class="brand"><span class="num">App 151</span><span class="name">Rainbow Readers 2.0</span></div>
  <div class="right">
    <span class="vm" id="vmPill">Visual mode</span>
    <span class="stars" id="starBox" aria-label="Stars"><span id="starIcon"></span><span id="starCount">0</span></span>
    <button class="btn gear" id="gear" aria-label="Grown ups: hold for three seconds"></button>
  </div>
</header>

<main class="stage" id="stage">
  <section class="screen" data-screen="title" id="sTitle"></section>
  <section class="screen" data-screen="placement" id="sPlacement"></section>
  <section class="screen" data-screen="home" id="sHome"></section>
  <section class="screen" data-screen="game" id="sGame"></section>
  <section class="screen" data-screen="reward" id="sReward"></section>
  <section class="screen" data-screen="shelf" id="sShelf"></section>
  <section class="screen" data-screen="parent" id="sParent"></section>
</main>

<footer class="ftr">
  <a class="back-link fx" href="https://augustineiacopelli.github.io/appaday/">AppADay Portfolio</a>
  <span>Arrows or d pad to move. Enter or A to choose. Esc or B to go back.</span>
</footer>

<div class="overlay" id="gate" role="dialog" aria-modal="true" aria-label="Grown ups check"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== Rainbow Readers 2.0 | AppADay 151 ===== */
'use strict';

/* ---------- DATA ---------- */
var LETTER_CUES = {
  a:'apple', b:'ball', c:'cat', d:'dog', e:'egg', f:'fish', g:'goat', h:'hat', i:'igloo', j:'jam',
  k:'kite', l:'lion', m:'moon', n:'nest', o:'octopus', p:'pig', q:'queen', r:'rain', s:'sun', t:'top',
  u:'umbrella', v:'van', w:'web', x:'fox', y:'yarn', z:'zebra'
};
function letterCue(ch){ var w = LETTER_CUES[ch]; return w ? (ch + ', as in ' + w) : ch; }

var GAME_INFO = {
  bubble:  { name:'Bubble Pop',      rank:1 },
  bingo:   { name:'Bingo',           rank:2 },
  sort:    { name:'Word Sort',       rank:3 },
  build:   { name:'Letter Build',    rank:4 },
  sentence:{ name:'Sentence Builder',rank:5 },
  passage: { name:'Passage Reader',  rank:6 }
};

var PATTERNS = {
  shortVowel: { label:'Short vowel', classify:function(w){ var m = w.match(/[aeiou]/); return m ? ('short ' + m[0]) : null; } },
  digraph:    { label:'Digraph', classify:function(w){ var k = ['sh','ch','th','wh','ck']; for (var i=0;i<k.length;i++){ if (w.indexOf(k[i]) >= 0) return k[i]; } return null; } },
  blendStart: { label:'Starting blend', classify:function(w){ var b = w.slice(0,2); if (b[0]==='s') return 's blends'; if (b[1]==='r') return 'r blends'; if (b[1]==='l') return 'l blends'; return null; } },
  blendEnd:   { label:'Ending blend', classify:function(w){ return w.slice(-2); } },
  magicE:     { label:'Silent e', classify:function(w){ var m = w.match(/([aeiou])[^aeiou]e$/); return m ? (m[1] + '_e') : null; } },
  vowelTeam:  { label:'Vowel team', classify:function(w){ if (/ai|ay/.test(w)) return 'long a'; if (/ee|ea/.test(w)) return 'long e'; if (/oa|ow/.test(w)) return 'long o'; return null; } },
  rControl:   { label:'Bossy r', classify:function(w){ if (/ar/.test(w)) return 'ar'; if (/or/.test(w)) return 'or'; if (/er|ir|ur/.test(w)) return 'er ir ur'; return null; } },
  diphthong:  { label:'Diphthong', classify:function(w){ if (/oi|oy/.test(w)) return 'oi oy'; if (/ou|ow/.test(w)) return 'ou ow'; return null; } },
  ending:     { label:'Ending', classify:function(w){ if (/ing$/.test(w)) return '-ing'; if (/ed$/.test(w)) return '-ed'; if (/s$/.test(w)) return '-s -es'; return null; } },
  prefix:     { label:'Prefix', classify:function(w){ var p = ['pre','dis','re','un']; for (var i=0;i<p.length;i++){ if (w.indexOf(p[i])===0) return p[i] + '-'; } return null; } },
  suffix:     { label:'Suffix', classify:function(w){ var s = ['ness','less','ful','ly']; for (var i=0;i<s.length;i++){ if (w.slice(-s[i].length)===s[i]) return '-' + s[i]; } return null; } }
};

var SKILLS = [
  { id:'g1-letters', band:1, title:'Letter Sounds', kind:'letter', words:'abcdefghijklmnopqrstuvwxyz'.split(''), games:['bubble','bingo'] },
  { id:'g1-cvc-a', band:1, title:'Short a Words', kind:'word', words:['cat','hat','map','bag','fan','jam','man','pan','rat','sad','van','cap','dad','ham'], games:['bubble','build','bingo'] },
  { id:'g1-cvc-e', band:1, title:'Short e Words', kind:'word', words:['bed','hen','jet','leg','net','pen','red','ten','web','wet','beg','men'], games:['bubble','build','bingo'] },
  { id:'g1-cvc-i', band:1, title:'Short i Words', kind:'word', words:['big','dig','fin','hit','kid','lip','pig','pin','sit','six','win','zip'], games:['bubble','build','bingo'] },
  { id:'g1-cvc-o', band:1, title:'Short o Words', kind:'word', words:['box','cot','dog','fox','hop','hot','log','mop','pot','top','rod','job'], games:['bubble','build','bingo'] },
  { id:'g1-cvc-u', band:1, title:'Short u Words', kind:'word', words:['bug','bus','cub','cup','fun','gum','hug','mud','nut','rug','run','sun'], games:['bubble','build','bingo'] },
  { id:'g1-cvc-mix', band:1, title:'Mixed Short Vowels', kind:'pattern', pattern:'shortVowel', words:['cat','bag','pen','web','pig','fin','dog','pot','bug','sun','hat','leg','zip','mop','cup'], games:['bubble','sort','build','bingo'] },
  { id:'g1-digraphs', band:1, title:'Digraphs: sh ch th', kind:'pattern', pattern:'digraph', words:['ship','shop','fish','dish','chin','chip','chop','much','thin','math','bath','with','whip','when','duck','back'], games:['bubble','sort','build','bingo','sentence'] },
  { id:'g1-blends-start', band:1, title:'Starting Blends', kind:'pattern', pattern:'blendStart', words:['frog','flag','crab','drum','slip','stop','swim','plan','grab','clap','snap','trip','spin','glad'], games:['bubble','sort','build','bingo','sentence'] },
  { id:'g1-blends-end', band:1, title:'Ending Blends', kind:'pattern', pattern:'blendEnd', words:['hand','band','pond','jump','lamp','camp','nest','list','fast','sink','pink','milk','tent','belt'], games:['bubble','sort','build','bingo','sentence'] },
  { id:'g1-silent-e', band:1, title:'Silent e', kind:'pattern', pattern:'magicE', words:['cake','game','lake','bike','kite','ride','five','home','rope','bone','note','cute','tube','mule'], games:['bubble','sort','build','bingo','sentence'] },

  { id:'g2-vowel-teams', band:2, title:'Vowel Teams', kind:'pattern', pattern:'vowelTeam', words:['rain','tail','play','day','seed','feet','team','leaf','boat','road','snow','coat'], games:['bubble','sort','build','bingo','sentence','passage'] },
  { id:'g2-r-controlled', band:2, title:'Bossy r Words', kind:'pattern', pattern:'rControl', words:['car','star','farm','park','corn','fork','horn','bird','girl','fern','her','burn','turn','shirt'], games:['bubble','sort','build','bingo','sentence','passage'] },
  { id:'g2-diphthongs', band:2, title:'oi oy ou ow', kind:'pattern', pattern:'diphthong', words:['coin','boil','soil','toy','boy','joy','cloud','house','mouth','cow','owl','town'], games:['bubble','sort','build','bingo','sentence','passage'] },
  { id:'g2-contractions', band:2, title:'Contractions', kind:'word', words:["can't","don't","it's","I'm","we're","she's","isn't","you'll","they're","didn't"], games:['bubble','build','bingo','sentence','passage'] },
  { id:'g2-compounds', band:2, title:'Compound Words', kind:'word', words:['sunset','rainbow','cupcake','football','starfish','popcorn','bedtime','mailbox','sandbox','raincoat','backpack','snowman'], games:['bubble','build','bingo','sentence','passage'] },

var Store = (function(){
  var KEY = 'rr2.state', VER = 1;
  function fresh(){
    return { ver:VER, stepId:SKILLS[0].id, placed:false, history:{}, wordStats:{}, stars:0, unlocked:1, stickers:[],
      settings:{ rate:0.8, voice:'', speech:true, sound:true }, overrides:{} };
  }
  function migrate(o){
    try {
      var f = fresh();
      if (!o || typeof o !== 'object') return f;
      Object.keys(f).forEach(function(k){ if (o[k] === undefined) o[k] = f[k]; });
      Object.keys(f.settings).forEach(function(k){ if (o.settings[k] === undefined) o.settings[k] = f.settings[k]; });
      if (!SKILLS.some(function(s){ return s.id === o.stepId; })) o.stepId = SKILLS[0].id;
      o.ver = VER;
      return o;
    } catch (e) { return fresh(); }
  }
  var state = fresh();
  function load(){ try { var raw = localStorage.getItem(KEY); state = migrate(raw ? JSON.parse(raw) : null); } catch (e) { state = fresh(); } return state; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function reset(){ state = fresh(); try { localStorage.removeItem(KEY); } catch (e) {} save(); return state; }
  return { load:load, save:save, reset:reset, get:function(){ return state; }, KEY:KEY };
})();
function S(){ return Store.get(); }

var Engine = (function(){
  var DAY = 86400000;

  function sightFor(band){ var o = []; (SIGHT_BY_BAND[band] || []).forEach(function(k){ o = o.concat(SIGHT[k]); }); return o; }
  function weight(w){
    var s = S().wordStats[w], now = Date.now();
    if (!s || !s.seen) return 4;
    var miss = 1 - s.correct / s.seen, age = Math.min(1, (now - (s.last || 0)) / (3*DAY));
    return 1 + 3*miss + 2*age;
  }
  function weightedSample(pool, n){
    var out = [], bag = pool.slice();
    while (out.length < n && pool.length){
      if (!bag.length) bag = pool.slice();
      var tot = 0, ws = bag.map(function(w){ var x = weight(w); tot += x; return x; });
      var r = Math.random() * tot, i = 0;
      for (; i < bag.length - 1; i++){ r -= ws[i]; if (r <= 0) break; }
      out.push(bag[i]); bag.splice(i, 1);
    }
    return out;
  }
  function neighborWords(idx){
    var st = SKILLS[idx], o = [];
    function wordish(k){ return k === 'word' || k === 'pattern'; }
    [idx-1, idx+1].forEach(function(j){
      var n = SKILLS[j]; if (!n) return;
      if (n.kind === st.kind || (wordish(n.kind) && wordish(st.kind))) o = o.concat(wordsFor(n.id));
    });
    return o;
  }
  function partnerOf(st, w){
    if (!st.pairs) return null;
    for (var i=0;i<st.pairs.length;i++){ var p = st.pairs[i]; if (p[0]===w) return p[1]; if (p[1]===w) return p[0]; }
    return null;
  }
  function speakFor(st, w, isSight){
    if (isSight) return w;
    if (st.kind === 'letter') return letterCue(w);
    if (st.hints && st.hints[w]) return w + '. ' + st.hints[w];
    return w;
  }
  function distractors(st, idx, target, pool, count){
    var out = [], p = partnerOf(st, target);

/* ---------- SPEAKER ---------- */
var Speaker = (function(){
  var voices = [], ready = false, visual = false, cur = null, timer = null, waiters = [];

  function init(cb){
    var done = false;
    function finish(){
      if (done) return; done = true;
      try { voices = synth ? synth.getVoices() || [] : []; } catch (e) { voices = []; }
      ready = true; refresh(); if (cb) cb(); var w = waiters; waiters = []; w.forEach(function(f){ f(); });
    }
    if (!synth){ finish(); return; }
    try { voices = synth.getVoices() || []; } catch (e) { voices = []; }
    if (voices.length){ finish(); return; }
    try { synth.addEventListener('voiceschanged', function(){ try { if ((synth.getVoices() || []).length) finish(); } catch (e) {} }); } catch (e) {}
    setTimeout(finish, 2000);
  }
  function hasVoices(){ return voices.length > 0; }
  function refresh(){ visual = !(hasVoices() && S().settings.speech); var p = $('vmPill'); if (p) p.classList.toggle('on', visual); }
  function voice(){
    var want = S().settings.voice, v = null;
    if (want) v = voices.filter(function(x){ return x.name === want; })[0];
    if (!v) v = voices.filter(function(x){ return /en[-_]US/i.test(x.lang); })[0];
    if (!v) v = voices.filter(function(x){ return /^en/i.test(x.lang); })[0];
    return v || voices[0] || null;
  }
  function englishVoices(){ var e = voices.filter(function(x){ return /^en/i.test(x.lang); }); return e.length ? e : voices.slice(); }
  function stop(){ clearInterval(timer); timer = null; try { if (synth) synth.cancel(); } catch (e) {} cur = null; }
  function timed(text, onWord, onEnd){
    var words = text.split(/\s+/).filter(Boolean), i = 0, rate = S().settings.rate || 0.8, ms = Math.round(420 / rate);
    clearInterval(timer);
    if (onWord) onWord(0);
    timer = setInterval(function(){
      i++;
      if (i >= words.length){ clearInterval(timer); timer = null; if (onWord) onWord(-1); if (onEnd) onEnd(); return; }
      if (onWord) onWord(i);
    }, ms);
  }
  function say(text, onWord, onEnd){
    stop();

    var v = voice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';

    };
    function end(){ if (ended) return; ended = true; if (fb !== 'timed'){ if (onWord) onWord(-1); if (onEnd) onEnd(); } }
    u.onend = end; u.onerror = end;
    cur = u;
    try { synth.speak(u); } catch (e) { end(); return; }
    if (onWord){
      setTimeout(function(){ if (!gotBoundary && !ended && cur === u){ fb = 'timed'; timed(text, onWord, onEnd); } }, 700);
    }
  }
  function whenReady(f){ if (ready) f(); else waiters.push(f); }
  return { init:init, whenReady:whenReady, say:say, stop:stop, refresh:refresh, hasVoices:hasVoices, isVisual:function(){ return visual; }, englishVoices:englishVoices, current:voice };
})();

var Focus = (function(){
  var stack = [];

    var t = top(), list = Array.prototype.slice.call(t.querySelectorAll(SEL));

      list = list.concat(Array.prototype.slice.call(document.querySelectorAll('.hdr ' + 'a.fx, .ftr a.fx, #gear')));
    }
    return list.filter(visible);
  }
  function current(){ var a = document.activeElement, c = candidates(); return c.indexOf(a) >= 0 ? a : null; }

  }

      if (el === cur) return;
      var b = el.getBoundingClientRect(), bc = center(b), dx = bc.x - ac.x, dy = bc.y - ac.y, p, o;
      if (dir === 'right'){ if (b.left < a.right - 4 && dx <= 4) return; p = dx; o = Math.abs(dy); }
      else if (dir === 'left'){ if (b.right > a.left + 4 && dx >= -4) return; p = -dx; o = Math.abs(dy); }
      else if (dir === 'down'){ if (b.top < a.bottom - 4 && dy <= 4) return; p = dy; o = Math.abs(dx); }

})();

GAMES.bingo = {
  start:function(){
    var items = Engine.buildRound(Play.stepId, 9, 'bingo'), cells = uniq(items.map(function(x){ return x.target; }));
    var extra = shuffle(Engine.wordsFor(Play.stepId).concat(SIGHT.preprimer));
    while (cells.length < 9 && extra.length){ var w = extra.pop(); if (cells.indexOf(w) < 0) cells.push(w); }
    Play.cells = shuffle(cells.slice(0, 9)); Play.marked = []; Play.calls = shuffle(Play.cells.slice()); Play.idx = 0;
    this.render();
  },
  render:function(){
    Play.first = true; Play.busy = false;
    var w = Play.calls[Play.idx];
    Play.cur = { target:w, speak:Engine.speakFor(Play.step, w, Engine.wordsFor(Play.stepId).indexOf(w) < 0 && Play.step.kind !== 'letter') };
    clear($('gDots'));
    html($('gBody'), G.promptHTML(Play.cur, 'Listen, then find it on your card') + '<div class="card">' + Play.cells.map(function(c, i){
      return '<button class="btn cell' + (Play.marked.indexOf(i) >= 0 ? ' mark' : '') + '" data-i="' + i + '">' + esc(c) + '</button>'; }).join('') + '</div>');
    G.wire('[data-i]', function(b){ GAMES.bingo.handle(+b.getAttribute('data-i'), b); });

  line:function(){
    var L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]], m = Play.marked;

    }
  }
};

  start:function(){

    $('pSpeech').onclick = function(){ set.speech = !set.speech; Store.save(); Speaker.refresh(); self.draw(); Focus.first('#pSpeech'); };
    $('pSound').onclick = function(){ set.sound = !set.sound; Store.save(); self.draw(); Focus.first('#pSound'); };
    $('pSlow').onclick = function(){ set.rate = Math.max(0.5, Math.round((set.rate - 0.1)*10)/10); Store.save(); $('pRate').textContent = set.rate.toFixed(1); };
    $('pFast').onclick = function(){ set.rate = Math.min(1.3, Math.round((set.rate + 0.1)*10)/10); Store.save(); $('pRate').textContent = set.rate.toFixed(1); };
    $('pVoice').onclick = function(){
      var vs = Speaker.englishVoices(); if (!vs.length){ toast('No voices available'); return; }
      var c = Speaker.current(), i = vs.indexOf(c); var n = vs[(i + 1) % vs.length]; set.voice = n.name; Store.save();
      $('pVoice').textContent = 'Voice: ' + n.name; Speaker.say('Hello, reader!'); };
    $('pTest').onclick = function(){ Speaker.say('The cat sat on the mat.'); };
    $('pPlace').onclick = function(){ S().placed = false; Store.save(); Router.go('placement'); };
    $('pReset').onclick = function(){
      if (!resetArmed){ resetArmed = true; $('pReset').textContent = 'Tap again to erase everything'; clearTimeout(resetTimer);
        resetTimer = setTimeout(function(){ resetArmed = false; var b = $('pReset'); if (b) b.textContent = 'Reset progress'; }, 4000); return; }
      resetArmed = false; clearTimeout(resetTimer); Store.reset(); Speaker.refresh(); starCount(); toast('Progress reset'); Router.go('title'); };
    $('pDoneBtn').onclick = function(){ Router.go('home'); };
  },
  back:function(){ resetArmed = false; Router.go('home'); }
};

/* ---------- INPUT: keyboard, pointer, gamepad ---------- */
document.addEventListener('pointerdown', function(){ Sfx.unlock(); }, { passive:true });
document.addEventListener('keydown', function(e){
  Sfx.unlock();
  var a = document.activeElement, inText = a && a.tagName === 'TEXTAREA', k = e.key;
  if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight'){
    if (inText) return;
    e.preventDefault(); Focus.move(k.slice(5).toLowerCase()); return;
  }
  if (k === 'Enter' || k === ' '){
    if (a && a.id === 'gear'){ e.preventDefault(); if (!e.repeat) Hold.start('key'); return; }
    if (inText) return;
    if (!a || a === document.body){ e.preventDefault(); Focus.first(); }
    return;
  }
  if (k === 'Escape'){
    e.preventDefault();
    if (e.repeat) return;
    if (inText){ a.blur(); Focus.first('#pSave'); return; }
    var wasOpen = Gate.isOpen(); Router.back(); if (!wasOpen) Hold.start('esc'); return;
  }
  if (k === 'Backspace' && !inText){ e.preventDefault(); if (!e.repeat) Router.back(); }
});
document.addEventListener('keyup', function(e){
  if (e.key === 'Escape') Hold.end('esc');
  if (e.key === 'Enter' || e.key === ' ') Hold.end('key');
});
(function(){
  var g = $('gear');
  g.addEventListener('pointerdown', function(e){ e.preventDefault(); Hold.start('ptr'); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(t){ g.addEventListener(t, function(){ Hold.end('ptr'); }); });
  g.addEventListener('click', function(e){ e.preventDefault(); if (!Gate.isOpen() && Router.name() !== 'parent') toast('Grown ups: hold the gear for 3 seconds'); });
  g.addEventListener('contextmenu', function(e){ e.preventDefault(); });
})();

var Pad = (function(){
  var prev = {}, rep = {}, DIRS = ['up','down','left','right'];
  function read(gp){
    var b = function(i){ var x = gp.buttons[i]; return !!(x && (x.pressed || x.value > 0.5)); };
    var ax = gp.axes || [];
    return { up:b(12) || ax[1] < -0.5, down:b(13) || ax[1] > 0.5, left:b(14) || ax[0] < -0.5, right:b(15) || ax[0] > 0.5, a:b(0), b:b(1), start:b(9) };
  }
  function poll(){
    var pads = [], gp = null;
    try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch (e) {}
    for (var i=0;i<(pads ? pads.length : 0);i++){ if (pads[i] && pads[i].connected !== false){ gp = pads[i]; break; } }
    if (gp){
      var s = read(gp), now = performance.now();
      DIRS.forEach(function(d){
        if (s[d]){
          if (!prev[d]){ Focus.move(d); rep[d] = now + 400; }
          else if (now >= rep[d]){ Focus.move(d); rep[d] = now + 140; }
        }
      });
      if (s.a && !prev.a){ Sfx.unlock(); var el = Focus.current(); if (el && el.id === 'gear') Hold.start('padA'); else Focus.activate(); }
      if (!s.a && prev.a) Hold.end('padA');
      if (s.b && !prev.b){ Sfx.unlock(); var ae = document.activeElement; if (ae && ae.tagName === 'TEXTAREA'){ ae.blur(); Focus.first('#pSave'); } else { var wo = Gate.isOpen(); Router.back(); if (!wo) Hold.start('pad'); } }
      if (!s.b && prev.b) Hold.end('pad');
      if (s.start && !prev.start){ Sfx.unlock(); Router.home(); }
      prev = s;
    }
    requestAnimationFrame(poll);
  }
  return { start:function(){ requestAnimationFrame(poll); } };
})();

/* ---------- BOOT ---------- */
(function boot(){
  Store.load();
  $('starIcon').innerHTML = ICON.star;
  $('gear').innerHTML = ICON.gear;
  starCount();
  Speaker.init(function(){ /* visual mode flag is refreshed inside init */ });
  Router.go('title');
  Pad.start();
})();
</script>
